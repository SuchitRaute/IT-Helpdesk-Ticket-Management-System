
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexDesk | Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        .dashboard-content {
            padding: 30px;
        }

        .dashboard-heading {
            margin-bottom: 25px;
        }

        .dashboard-heading h1 {
            margin: 0 0 8px;
        }

        .dashboard-heading p {
            color: #777;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            padding: 24px;
            border-radius: 16px;
            background: var(--card-bg, #fff);
            box-shadow: 0 5px 20px rgba(30, 20, 70, 0.08);
        }

        .metric-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: #eee8ff;
            color: #7047eb;
            font-size: 21px;
            margin-bottom: 18px;
        }

        .metric-value {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .metric-label {
            color: #777;
            font-size: 14px;
        }

        .dashboard-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .dashboard-btn {
            display: inline-block;
            padding: 12px 18px;
            background: #7047eb;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }

        .dashboard-btn.secondary {
            background: #eee8ff;
            color: #5533c5;
        }

        .recent-tickets {
            background: var(--card-bg, #fff);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(30, 20, 70, 0.08);
            overflow-x: auto;
        }

        .recent-tickets h2 {
            margin-top: 0;
        }

        .recent-tickets table {
            width: 100%;
            border-collapse: collapse;
        }

        .recent-tickets th,
        .recent-tickets td {
            padding: 14px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        .recent-tickets th {
            color: #777;
        }

        #dashboardMessage {
            margin: 12px 0;
            color: #777;
        }
    </style>
</head>

<body>
    <div class="dashboard-content">
        <header class="dashboard-heading">
            <h1><i class="fa-solid fa-chart-line"></i> NexDesk Dashboard</h1>
            <p>Overview of real support tickets from your database.</p>
        </header>

        <nav class="dashboard-actions">
            <a class="dashboard-btn" href="create-ticket.html">
                <i class="fa-solid fa-plus"></i> Create Ticket
            </a>
            <a class="dashboard-btn secondary" href="tickets">
                <i class="fa-solid fa-ticket"></i> All Tickets
            </a>
            <a class="dashboard-btn secondary" href="employees.html">
                <i class="fa-solid fa-users"></i> Employees
            </a>
            <a class="dashboard-btn secondary" href="reports.html">
                <i class="fa-solid fa-chart-column"></i> Reports
            </a>
            <a class="dashboard-btn secondary" href="logout">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </a>
        </nav>

        <section class="metrics-grid">
            <article class="metric-card">
                <div class="metric-icon">
                    <i class="fa-solid fa-ticket"></i>
                </div>
                <div class="metric-value" id="totalTickets">0</div>
                <div class="metric-label">Total Tickets</div>
            </article>

            <article class="metric-card">
                <div class="metric-icon">
                    <i class="fa-solid fa-circle-dot"></i>
                </div>
                <div class="metric-value" id="openTickets">0</div>
                <div class="metric-label">Open Tickets</div>
            </article>

            <article class="metric-card">
                <div class="metric-icon">
                    <i class="fa-solid fa-spinner"></i>
                </div>
                <div class="metric-value" id="inProgressTickets">0</div>
                <div class="metric-label">In Progress</div>
            </article>

            <article class="metric-card">
                <div class="metric-icon">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                <div class="metric-value" id="resolvedTickets">0</div>
                <div class="metric-label">Resolved Tickets</div>
            </article>

            <article class="metric-card">
                <div class="metric-icon">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <div class="metric-value" id="closedTickets">0</div>
                <div class="metric-label">Closed Tickets</div>
            </article>
        </section>

        <section class="recent-tickets">
            <h2>Recent Tickets</h2>
            <p id="dashboardMessage">Loading tickets...</p>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Priority</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="recentTicketsBody">
                    <tr>
                        <td colspan="5">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </div>

    <script>
        async function loadDashboard() {
            const message = document.getElementById("dashboardMessage");
            const tbody = document.getElementById("recentTicketsBody");

            try {
                /*
                 * DashboardServlet must return JSON containing:
                 * totalTickets, openTickets, inProgressTickets,
                 * resolvedTickets, closedTickets, and recentTickets.
                 */
                const response = await fetch("dashboard-data", {
                    headers: { "Accept": "application/json" },
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error("Dashboard endpoint returned HTTP " +
                                    response.status);
                }

                const data = await response.json();

                document.getElementById("totalTickets").textContent =
                    data.totalTickets ?? 0;
                document.getElementById("openTickets").textContent =
                    data.openTickets ?? 0;
                document.getElementById("inProgressTickets").textContent =
                    data.inProgressTickets ?? 0;
                document.getElementById("resolvedTickets").textContent =
                    data.resolvedTickets ?? 0;
                document.getElementById("closedTickets").textContent =
                    data.closedTickets ?? 0;

                const tickets = data.recentTickets ?? [];

                tbody.replaceChildren();

                if (tickets.length === 0) {
                    const row = tbody.insertRow();
                    const cell = row.insertCell();
                    cell.colSpan = 5;
                    cell.textContent = "No tickets created yet.";
                } else {
                    tickets.forEach(ticket => {
                        const row = tbody.insertRow();

                        [
                            ticket.ticketId ?? ticket.ticket_id ?? "",
                            ticket.title ?? "",
                            ticket.category ?? "",
                            ticket.priority ?? "",
                            ticket.status ?? ""
                        ].forEach(value => {
                            const cell = row.insertCell();
                            cell.textContent = value;
                        });
                    });
                }

                message.textContent = "Dashboard updated from database.";
            } catch (error) {
                message.textContent =
                    "Could not load live data. Check DashboardServlet and its URL mapping.";
                tbody.replaceChildren();

                const row = tbody.insertRow();
                const cell = row.insertCell();
                cell.colSpan = 5;
                cell.textContent =
                    "Live ticket data is unavailable. No demo data is being shown.";

                console.error("Dashboard loading error:", error);
            }
        }

        loadDashboard();
    </script>
</body>
</html>
```
